name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all]"
      - run: pytest

  integration:
    name: Integration tests (Neo4j, PostgreSQL, Redis)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/integration-test
        ports:
          - 17687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-test 'RETURN 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
          --health-start-period 20s
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deception
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: deceptiongraph_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U deception -d deceptiongraph_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DG_TEST_NEO4J_URI: bolt://localhost:17687
      DG_TEST_NEO4J_PASSWORD: integration-test
      DG_TEST_DATABASE_URL: postgresql+psycopg://deception:integration-test@localhost:15432/deceptiongraph_test
      DG_TEST_REDIS_URL: redis://localhost:16379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[all]"
      - run: pytest tests/integration -rA
