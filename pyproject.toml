[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deceptiongraph"
version = "1.1.0"
description = "Adaptive cyber-deception digital twin: attack-graph analysis, deception placement and an adaptation loop"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["security", "deception", "attack-graph", "honeypot", "threat-detection"]

# The core is deliberately light: the analysis, deception and runtime layers
# need nothing but NetworkX and a YAML parser. Databases and the HTTP service
# are extras, so the project runs with no containers at all.
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
storage = [
    "neo4j>=5.18",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
]
# The LANL real-data models: lateral-movement detector and target ranker.
ml = ["scikit-learn>=1.4", "numpy>=1.26", "joblib>=1.3"]
# Traces and metrics for the live loop.
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "prometheus-client>=0.20",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
all = [
    "deceptiongraph[service]",
    "deceptiongraph[storage]",
    "deceptiongraph[ml]",
    "deceptiongraph[observability]",
    "deceptiongraph[dev]",
]

[project.scripts]
dgraph = "deceptiongraph.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: needs live Neo4j, PostgreSQL and Redis (scripts/integration.ps1); skipped otherwise",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
